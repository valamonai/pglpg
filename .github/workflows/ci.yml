name: CI

on:
  push:
    branches: [master]
  pull_request:

# One job on the latest Ruby, ActiveRecord and PostgreSQL, which are also the
# minimum supported versions: specs, then the benchmark. ActiveRecord is
# the newest release the gemspec allows (there is no committed lockfile).
jobs:
  test:
    name: Ruby 4.0 · PostgreSQL 18 · latest ActiveRecord
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGLPG_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pglpg_test
      PGLPG_BENCH_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pglpg_bench
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: createdb -h localhost -U postgres pglpg_test && createdb -h localhost -U postgres pglpg_bench
      - run: bundle exec rspec
      - name: Benchmark (reduced scale)
        env:
          BENCH_SCALE: "0.2"
          BENCH_RUNS: "100"
          BENCH_MAX_P95_MS: "250"
          BENCH_MAX_BUFFERS: "50000"
        run: bundle exec ruby bench/run.rb | tee -a "$GITHUB_STEP_SUMMARY"
