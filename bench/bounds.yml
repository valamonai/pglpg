# Declared bounds per cell: fixture → shape → viewer clearance. bench/gate.rb
# fails a cell whose p95 latency (latency_ms) or p95 shared buffers (buffers)
# exceeds its bound, or whose workload over its start list returns fewer than
# min_total rows or min_nonempty non-empty starts. Every measured cell needs
# a bound. Start from bench/calibrate.rb, then review: hop3 on 1m must stay
# under the 0.2 target of 500 ms.
#
# relative: the comparison with a baseline revision on the same fixture.
# Buffers may grow by buffer_allowance (or buffer_slack, if larger); p95
# latency may grow by latency_ratio, a coarse slowdown guard, with both
# sides raised to latency_floor_ms. Initial values, to tune on repeated runs.
